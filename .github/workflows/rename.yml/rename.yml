name: Rename homepage to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename homepage file
        run: |
          git config user.name "jbree825"
          git config user.email "jbree825@users.noreply.github.com"
          git mv riya-helps-shops-portfolio-website.html index.html
          git commit -m "Rename homepage to index.html"
          git push
